<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Cultures Interactive</title>
    <style>
        :root {
            /* Vintage Travel / Passport Theme */
            --primary: #2a5c8d; 
            --primary-dark: #1e456d;
            --secondary: #c93b3b; 
            --bg-color: #f4efe6; 
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --correct: #4CAF50;
            --correct-dark: #388E3C;
            --incorrect: #c93b3b;
            --radius-lg: 12px;
            --shadow-soft: 0 6px 0 rgba(0,0,0,0.05);
            --stamp-opacity: 0.15;
        }

        [data-theme="dark"] {
            --primary: #4fa3e3;
            --primary-dark: #2a5c8d;
            --secondary: #ff6b6b;
            --bg-color: #1a222c; 
            --card-bg: #2d3744;
            --text-main: #f4efe6;
            --text-muted: #a0aab5;
            --shadow-soft: 0 6px 0 rgba(0,0,0,0.3);
            --stamp-opacity: 0.05;
        }

        * {
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            transition: background-color 0.3s ease;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Passport Stamp Background Pattern */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 30%, transparent 60%, var(--primary) 61%, transparent 63%),
                radial-gradient(circle at 80% 70%, transparent 60%, var(--secondary) 61%, transparent 63%);
            background-size: 300px 300px;
            opacity: var(--stamp-opacity);
            pointer-events: none;
            z-index: -1;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--card-bg);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-bottom: 3px dashed var(--secondary);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
            font-family: 'Arial', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: bold;
            font-size: 1.2rem;
        }

        #dark-mode-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        #app-container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem;
            position: relative;
        }

        /* Cards & Buttons */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .level-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 2.5rem 1.5rem;
            text-align: center;
            box-shadow: var(--shadow-soft);
            border: 2px solid var(--primary);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .level-card::after {
            content: "DEPARTURE";
            position: absolute;
            top: 20px;
            right: -30px;
            transform: rotate(45deg);
            color: var(--secondary);
            font-weight: bold;
            font-size: 0.8rem;
            border: 2px solid var(--secondary);
            padding: 2px 20px;
            opacity: 0.3;
        }

        .level-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 0 rgba(0,0,0,0.1);
        }
        .level-card:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 transparent;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-bottom: 4px solid var(--primary-dark);
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            font-family: 'Arial', sans-serif;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            border-bottom: 0px;
            margin-bottom: 4px;
        }
        
        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-main);
            border: 2px solid var(--primary);
            border-bottom: 4px solid var(--primary);
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 2rem;
        }

        .reading-container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            margin-bottom: 2rem;
            font-family: 'Georgia', serif;
            line-height: 2;
            font-size: 1.2rem;
            border: 2px dashed var(--text-muted);
        }

        /* Word Cloud & Interactive Reading */
        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: rgba(42, 92, 141, 0.1);
            border-radius: 8px;
            border: 1px solid var(--primary);
        }

        .cloud-word {
            background: white;
            color: var(--primary);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-family: 'Arial', sans-serif;
            border: 2px solid var(--primary);
            box-shadow: 2px 2px 0 var(--primary);
            transition: all 0.3s;
        }

        .cloud-word.found {
            background: var(--correct);
            color: white;
            border-color: var(--correct-dark);
            box-shadow: 2px 2px 0 var(--correct-dark);
            text-decoration: line-through;
            opacity: 0.7;
        }

        .interactive-word {
            cursor: pointer;
            padding: 0 2px;
            border-radius: 3px;
            transition: background 0.2s;
        }

        .interactive-word:hover {
            background: rgba(42, 92, 141, 0.1);
        }

        .interactive-word.revealed {
            background: var(--primary);
            color: white;
            font-weight: bold;
        }

        hr {
            border: 0;
            height: 1px;
            background: var(--text-muted);
            opacity: 0.3;
            margin: 2rem 0;
        }

        /* Inputs */
        input[type="text"] {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            border: 2px dashed var(--primary);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-main);
            margin-top: 1rem;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }

        /* Flashcards */
        .flashcard-scene {
            width: 100%;
            height: 300px;
            perspective: 1000px;
            margin: 2rem 0;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
            border: 3px solid var(--primary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            font-family: 'Arial', sans-serif;
            font-size: 2.5rem;
        }
        .flashcard-back {
            transform: rotateY(180deg);
            background: var(--primary);
            color: white;
            border-color: var(--primary-dark);
        }

        /* Unscramble Vocab */
        .scrambled-text {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 10px;
            text-align: center;
            color: var(--secondary);
            margin: 2rem 0;
            text-transform: uppercase;
        }

        /* Sentence Drag & Drop */
        .sentence-dropzone {
            min-height: 80px;
            border: 3px dashed var(--primary);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(42, 92, 141, 0.05);
        }
        .word-bank {
            min-height: 80px;
            border: 2px solid #ccc;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--card-bg);
        }
        .draggable-word {
            padding: 10px 15px;
            background: white;
            border: 2px solid var(--primary);
            border-radius: 8px;
            cursor: grab;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 3px 0 var(--primary);
            transition: transform 0.1s;
            user-select: none;
        }
        .draggable-word:active {
            cursor: grabbing;
            transform: translateY(3px);
            box-shadow: 0 0 0 var(--primary);
        }

        /* Match Tradition Layout */
        .tradition-display {
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            color: var(--primary);
            margin-bottom: 2rem;
            padding: 2rem;
            background: rgba(42, 92, 141, 0.1);
            border-radius: 12px;
            border: 2px dashed var(--primary);
        }
        .flag-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }
        .flag-option {
            background: var(--card-bg);
            border: 2px solid var(--text-muted);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
        }
        .flag-option:hover {
            border-color: var(--primary);
            background: rgba(42, 92, 141, 0.05);
            transform: translateY(-3px);
        }
        .flag-emoji {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        /* Scratch Challenge */
        .scratch-wrapper {
            position: relative;
            width: 100%;
            height: 300px;
            background: #222;
            border: 6px solid var(--primary);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 2rem;
        }
        .scratch-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            visibility: hidden;
        }
        #scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
            z-index: 5;
            border-radius: 6px;
        }
        .flag-word-display {
            font-family: 'Arial', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 5px;
            text-align: center;
            margin-bottom: 1.5rem;
            font-weight: bold;
        }
        .hidden-word span {
            background: var(--primary-dark);
            color: transparent;
            border: 2px solid var(--bg-color);
            padding: 0 10px;
            margin: 0 3px;
            border-radius: 4px;
        }
        .revealed-word span {
            color: var(--text-main);
            background: transparent;
            border: none;
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.3s ease-out forwards;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }
        .level-image {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 1rem;
    border: 2px solid var(--primary);
}
/* Mobile Responsiveness for Buttons */
        @media (max-width: 600px) {
            .nav-buttons {
                flex-direction: column;
                gap: 15px;
            }
            .nav-buttons .btn {
                width: 100% !important;
                margin-top: 0;
            }
        }
    </style>
</head>

        // --- ACTIVITY 1: READING WITH WORD CLOUD ---

                    </div>

        function checkQuizAnswer(element, selectedIndex, correctAnswer, type) {
            if (type === 'mc') {
                const allButtons = element.parentElement.querySelectorAll('button');
                allButtons.forEach(btn => btn.style.pointerEvents = 'none');

                if (selectedIndex === correctAnswer) {
                    element.style.background = 'var(--correct)';
                    element.style.borderColor = 'var(--correct-dark)';
                    element.style.color = 'white';
                    updateXP(10);
                } else {
                    element.style.background = 'var(--incorrect)';
                    element.style.borderColor = 'darkred';
                    element.style.color = 'white';
                    element.classList.add('shake');
                    allButtons[correctAnswer].style.background = 'var(--correct)';
                    allButtons[correctAnswer].style.color = 'white';
                }
            } else if (type === 'fill') {
                const userAnswer = element.value.trim().toLowerCase();
                const actualAnswer = correctAnswer.toLowerCase();
                if (userAnswer.length > 3 && actualAnswer.includes(userAnswer) || userAnswer === actualAnswer) {
                    element.style.borderColor = 'var(--correct)';
                    element.style.backgroundColor = '#e8f5e9';
                    updateXP(15);
                    alert("Correct!");
                } else {
                    element.style.borderColor = 'var(--incorrect)';
                    element.classList.add('shake');
                    setTimeout(() => element.classList.remove('shake'), 400);
                    alert(`Not quite! Hint: ${correctAnswer}`);
                }
            }
        }

        // --- ACTIVITY 4: UNSCRAMBLE VOCAB ---
        function startVocabUnscramble() {
            currentVocabUnscrambleIndex = 0;
            renderVocabUnscramble();
        }

        function scrambleString(str) {
            let arr = str.split('');
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            let scrambled = arr.join('');
            if (scrambled === str && str.length > 3) return scrambleString(str);
            return scrambled;
        }

        function renderVocabUnscramble() {
            const wordsList = currentLevel.unscrambleWords;
            if (!wordsList || wordsList.length === 0) {
                alert("No vocabulary loaded for unscrambling.");
                return renderMenu();
            }
            
            const originalWord = wordsList[currentVocabUnscrambleIndex];
            const scrambledWord = scrambleString(originalWord);
            
            appContainer.innerHTML = `
                <button class="btn btn-secondary" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Menu</button>
                <div class="reading-container animate-pop" style="text-align:center;">

        function checkVocabUnscramble(correctWord) {
            const inputEl = document.getElementById('unscramble-input');

            if (userWord === correctWord.toLowerCase()) {

        // --- ACTIVITY 5: SENTENCE BUILDER ---
        function startSentenceUnscramble() {
            currentSentenceIndex = 0;
            renderSentenceUnscramble();
        }

        function renderSentenceUnscramble() {
            const sentencesList = currentLevel.sentences;
            if (!sentencesList || sentencesList.length === 0) {
                alert("No sentences loaded.");
                return renderMenu();
            }

            const sentence = sentencesList[currentSentenceIndex];
            let words = sentence.split(' ');
            
            let scrambledWords = [...words];
            for (let i = scrambledWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [scrambledWords[i], scrambledWords[j]] = [scrambledWords[j], scrambledWords[i]];
            }

            const wordsHTML = scrambledWords.map((w, i) => 
                `<div class="draggable-word" draggable="true" id="word-${i}" ondragstart="drag(event)" onclick="moveWordOnClick(this)">${w}</div>`
            ).join('');

            appContainer.innerHTML = `
                <button class="btn btn-secondary" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Menu</button>
                <div class="reading-container animate-pop">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); font-family:sans-serif; margin-bottom:1rem;">
                        <span>Sentence ${currentSentenceIndex + 1} of ${sentencesList.length}</span>
                    </div>
                    <h2 style="font-family:'Arial', sans-serif; margin-top:0;">Build the Sentence</h2>
                    <p style="color:var(--text-muted); font-family:sans-serif; font-size:1rem;">Drag and drop words, or click them to move them in order.</p>
                    
                    <div id="sentence-answer-zone" class="sentence-dropzone" ondrop="drop(event)" ondragover="allowDrop(event)">
                        <!-- Dropped words appear here -->
                    </div>
                    
                    <div id="sentence-word-bank" class="word-bank" ondrop="drop(event)" ondragover="allowDrop(event)">
                        ${wordsHTML}
                    </div>
                    
                    <button class="btn" style="margin-top:2rem;" onclick="checkSentenceUnscramble('${sentence.replace(/'/g, "\\'")}')">Check Sentence</button>
                </div>
            `;
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);
            
            if (ev.target.classList.contains('sentence-dropzone') || ev.target.classList.contains('word-bank')) {
                ev.target.appendChild(draggedElement);
            } else if (ev.target.classList.contains('draggable-word')) {
                ev.target.parentNode.insertBefore(draggedElement, ev.target.nextSibling);
            }
        }

        function moveWordOnClick(element) {
            const answerZone = document.getElementById('sentence-answer-zone');
            const wordBank = document.getElementById('sentence-word-bank');
            
            if (element.parentNode.id === 'sentence-word-bank') {
                answerZone.appendChild(element);
            } else {
                wordBank.appendChild(element);
            }
        }

        function checkSentenceUnscramble(correctSentence) {
            const answerZone = document.getElementById('sentence-answer-zone');
            const currentWords = Array.from(answerZone.children).map(el => el.innerText);

            }
        }

                        ${hiddenWordHTML}
                    </div>

                    <div class="nav-buttons">
                        <button class="btn btn-secondary" style="width:30%;" onclick="revealFlagWord()">Reveal</button>
                        <button class="btn" style="width:65%;" onclick="correctFlagGuess()">I Guessed it! (+20 XP)</button>
                    </div>
                </div>
            `;
            setupScratchCanvas();
        }

        function setupScratchCanvas() {
            scratchCanvasEl = document.getElementById('scratch-canvas');
            scratchCtx = scratchCanvasEl.getContext('2d');
            const imgEl = document.getElementById('secret-image');
            
            scratchCanvasEl.width = scratchCanvasEl.parentElement.offsetWidth;
            scratchCanvasEl.height = scratchCanvasEl.parentElement.offsetHeight;
            
            imgEl.style.visibility = 'hidden';
            scratchCtx.globalCompositeOperation = 'source-over';
            scratchCtx.fillStyle = '#a0aab5'; 
            scratchCtx.fillRect(0, 0, scratchCanvasEl.width, scratchCanvasEl.height);
            
            scratchCtx.fillStyle = '#8f99a3';
            scratchCtx.font = "20px Arial";
            for(let i=0; i<10; i++){
                scratchCtx.fillText("SCRATCH", Math.random()*scratchCanvasEl.width, Math.random()*scratchCanvasEl.height);
            }

            const scratchMove = (e) => {
                if (!isDrawing) return;
                imgEl.style.visibility = 'visible'; 
                const rect = scratchCanvasEl.getBoundingClientRect();
                
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                
                scratchCtx.globalCompositeOperation = 'destination-out';
                scratchCtx.beginPath(); 
                scratchCtx.arc(x, y, 35, 0, Math.PI * 2); 
                scratchCtx.fill();
            };

            scratchCanvasEl.onmousedown = (e) => { isDrawing = true; scratchMove(e); };
            window.onmouseup = () => isDrawing = false;
            scratchCanvasEl.onmousemove = scratchMove;
            
            scratchCanvasEl.ontouchstart = (e) => { isDrawing = true; scratchMove(e); e.preventDefault(); };
            scratchCanvasEl.ontouchmove = (e) => { scratchMove(e); e.preventDefault(); };
            window.ontouchend = () => isDrawing = false;
        }

        function revealFlagWord() {
            const imgEl = document.getElementById('secret-image');
            const wordArea = document.getElementById('word-area');
            imgEl.style.visibility = 'visible';
            wordArea.className = "flag-word-display revealed-word";
            scratchCtx.clearRect(0, 0, scratchCanvasEl.width, scratchCanvasEl.height);
        }

        function correctFlagGuess() {
            revealFlagWord();
            updateXP(20);
            setTimeout(() => {
                scratchChallengeIndex++;
                renderFlagChallenge();
            }, 1500);
        }

        // --- UTILS ---
        function setupThemeToggle() {
            const toggle = document.getElementById('dark-mode-toggle');
            toggle.addEventListener('click', () => {
                const isDark = document.body.getAttribute('data-theme') === 'dark';
                document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
                toggle.textContent = isDark ? '🌙' : '☀️';
            });
        }

        // Boot up
        init();
    </script>
</body>
</html>
